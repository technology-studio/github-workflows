name: 'Send Slack Notification'
description: 'Sends a message to Slack on job failure'
inputs:
  slack_bot_token:
    description: 'Slack bot token'
    required: true
  channel_id:
    description: 'Slack channel ID'
    required: true
  status_text:
    description: 'Text shown after the workflow link'
    required: false
    default: '🔴 failed'

runs:
  using: 'composite'
  steps:
    - name: Prepare Slack Message
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_COMMIT_URL: ${{ github.event.head_commit.url }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        STATUS_TEXT: ${{ inputs.status_text }}
      run: |
        COMMIT_MESSAGE=$(gh api "repos/${REPOSITORY}/commits/${SHA}" --jq '.commit.message' 2>/dev/null) \
          || COMMIT_MESSAGE='(unavailable)'
        DELIMITER="EOF_$(openssl rand -hex 16)"
        {
          echo "SLACK_MESSAGE<<${DELIMITER}"
          echo "\`${REPOSITORY}\` Workflow <${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}|${WORKFLOW}> ${STATUS_TEXT}"

          case "${EVENT_NAME}" in
            pull_request | pull_request_target)
              echo "PR <${PR_URL}|${PR_TITLE} #${PR_NUMBER}>"
              ;;
            schedule)
              echo "Scheduled workflow"
              echo "Branch: \`${REF_NAME}\` - SHA: \`${SHA}\`"
              echo "Commit message: \`${COMMIT_MESSAGE}\`"
              ;;
            push)
              echo "Branch: \`${REF_NAME}\`"
              echo "Commit: <${HEAD_COMMIT_URL}|${HEAD_COMMIT_MESSAGE}>"
              ;;
            *)
              echo "Branch: \`${REF_NAME}\`"
              echo "SHA: \`${SHA}\`"
              echo "Commit message: \`${COMMIT_MESSAGE}\`"
              ;;
          esac

          echo "${DELIMITER}"
        } >> "$GITHUB_ENV"

    - name: Post a message to Slack
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: chat.postMessage
        token: ${{ inputs.slack_bot_token }}
        payload: |
          {"channel": ${{ toJSON(inputs.channel_id) }}, "text": ${{ toJSON(env.SLACK_MESSAGE) }}}
