name: "PR"

on:
  workflow_call:
    secrets:
      TXO_SLACK_BOT_APP_TOKEN:
        required: true
      TXO_SLACK_GITHUB_OPS_CHANNEL_ID:
        required: true

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: "/"
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Send a Slack message on failure
        if: failure()
        uses: technology-studio/github-workflows/.github/actions/slack-failed-job-message@331e6f866da04053d27ba5890d1b9c60bc8ed2fa # main
        with:
          slack_bot_token: ${{ secrets.TXO_SLACK_BOT_APP_TOKEN }}
          channel_id: ${{ secrets.TXO_SLACK_GITHUB_OPS_CHANNEL_ID }}
